<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6750a4">
  <meta name="description" content="Tirage au sort moderne et installable.">
  <title>Tirage au Sort</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/random-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/random-icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #f4f0ff;
      --surface: rgba(255,255,255,0.82);
      --surface-strong: rgba(255,255,255,0.96);
      --surface-muted: rgba(245,240,255,0.92);
      --text: #1f1b24;
      --text-muted: #675f72;
      --border: rgba(124,117,138,0.2);
      --accent: #6750a4;
      --accent-strong: #7f67be;
      --accent-soft: rgba(103,80,164,0.14);
      --danger: #ba1a1a;
      --shadow: 0 12px 40px rgba(44,32,70,0.13);
      --r-xl: 28px;
      --r-lg: 20px;
      --r-sm: 14px;
    }
    body[data-mode="pairs"]  { --accent:#006782; --accent-strong:#2886a3; --accent-soft:rgba(0,103,130,.14); }
    body[data-mode="teams"]  { --accent:#2f6f4f; --accent-strong:#4a8b67; --accent-soft:rgba(47,111,79,.14); }
    body[data-mode="order"]  { --accent:#7a5600; --accent-strong:#9a7110; --accent-soft:rgba(122,86,0,.14); }
    body[data-mode="match"]  { --accent:#8f4c38; --accent-strong:#b2684f; --accent-soft:rgba(143,76,56,.14); }

    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
    html, body { height:100%; overflow:hidden; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: linear-gradient(140deg,#f8f5ff 0%,#eef3ff 55%,#f9f7ff 100%);
      transition: background 280ms ease;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ─────────────────────────────────────────── */
    .app-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      flex-shrink: 0;
      z-index: 10;
    }
    .app-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      flex: 1;
      color: var(--accent);
    }
    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 1.15rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 160ms ease, background 160ms ease;
      flex-shrink: 0;
    }
    .icon-btn:hover { transform: scale(1.08); background: var(--accent-soft); }
    .icon-btn.btn-accent { background: linear-gradient(135deg,var(--accent),var(--accent-strong)); color:#fff; }

    /* ── MAIN SPLIT ──────────────────────────────────────── */
    .app-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 380px;
      overflow: hidden;
    }

    /* ── LEFT PANEL ──────────────────────────────────────── */
    .left-panel {
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
      overflow: hidden;
    }

    /* mode tabs */
    .mode-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .mode-tabs::-webkit-scrollbar { display:none; }
    .mode-tab {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 160ms ease;
      white-space: nowrap;
    }
    .mode-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }

    /* lists wrapper and uniform card panels */
    .lists-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .list-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 12px;
      min-height: 0;
      transition: all 200ms ease;
    }
    .list-card.hidden { display: none !important; }

    /* list source selector */
    .list-source-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    .list-source-row label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .source-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .source-chip {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-strong);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 140ms ease;
    }
    .source-chip.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* textarea area */
    .textarea-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }
    .textarea-wrap label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .textarea-wrap textarea {
      flex: 1;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--surface-strong);
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.92rem;
      line-height: 1.5;
      outline: none;
      resize: none;
      min-height: 70px;
      transition: border-color 160ms ease, box-shadow 160ms ease;
      font-family: inherit;
    }
    .textarea-wrap textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    /* options row */
    .options-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .options-row label { font-size: 0.82rem; font-weight:700; color:var(--text-muted); }
    .options-row input[type="number"] {
      width: 68px;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--surface-strong);
      color: var(--text);
      padding: 7px 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 160ms ease;
    }
    .options-row .opts-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .options-row .opts-group.hidden { display: none !important; }

    /* save-flyout banner (shown after draw when list is ad-hoc) */
    .save-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: var(--r-sm);
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      font-size: 0.84rem;
      color: var(--accent);
      font-weight: 700;
      animation: reveal-up 300ms ease;
    }
    .save-banner span { flex:1; }
    .save-banner button {
      padding: 5px 12px;
      font-size: 0.82rem;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    /* draw button */
    .draw-btn {
      width: 100%;
      padding: 13px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
      flex-shrink: 0;
    }
    .draw-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(52,40,86,0.2); }
    .draw-btn:active:not(:disabled) { transform: translateY(0); }
    .draw-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── RIGHT PANEL (stage) ─────────────────────────────── */
    .stage-panel {
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
      overflow-y: auto;
      background: linear-gradient(180deg,rgba(255,255,255,0.95),rgba(250,247,255,0.8));
    }
    .stage-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .stage-badge {
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .stage-state {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
    }
    .slot-display {
      font-size: clamp(1.6rem,3vw,2.4rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.1;
      word-break: break-word;
    }
    .stage-orbit {
      display: grid;
      gap: 8px;
      min-height: 60px;
    }
    .stage[data-mode="single"] .stage-orbit { grid-template-columns: repeat(2, 1fr); }
    .stage[data-mode="pairs"]  .stage-orbit { grid-template-columns: repeat(2, 1fr); }
    .stage[data-mode="teams"]  .stage-orbit { grid-template-columns: repeat(3, 1fr); }
    .stage[data-mode="order"]  .stage-orbit { grid-template-columns: 1fr; }
    .stage[data-mode="match"]  .stage-orbit { grid-template-columns: 1fr; }
    .stage-chip {
      display: flex; align-items: center; justify-content: center;
      min-height: 36px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.88);
      border: 1px solid var(--border);
      font-size: 0.87rem;
      font-weight: 700;
      text-align: center;
      word-break: break-word;
      animation-delay: var(--delay, 0s);
    }
    .stage[data-mode="single"] .stage-chip { animation: float-chip 5s ease-in-out infinite; }
    .stage[data-mode="pairs"]  .stage-chip { animation: sway-chip 4.4s ease-in-out infinite; }
    .stage[data-mode="teams"]  .stage-chip { animation: bounce-chip 3.2s ease-in-out infinite; }
    .stage[data-mode="order"]  .stage-chip { animation: ticker-chip 2.8s ease-in-out infinite; }
    .stage[data-state="spinning"] .slot-display { animation: slot-roll 480ms ease-in-out infinite alternate; }
    .match-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
      animation: reveal-up 400ms ease both;
      animation-delay: var(--delay, 0s);
    }
    .match-arrow { text-align:center; color: var(--accent); font-weight:800; }
    .results-grid { display: grid; gap: 8px; }
    .results-grid:empty { display:none; }
    .result-box {
      padding: 12px 14px;
      border-radius: var(--r-lg);
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--border);
      animation: reveal-up 380ms ease both;
      animation-delay: var(--delay, 0s);
    }
    .result-box h4 {
      color: var(--accent);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .result-box p { font-weight: 600; line-height: 1.45; }

    /* ── MODAL ───────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(30,22,50,0.48);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
      opacity: 0; pointer-events: none;
      transition: opacity 220ms ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      width: 100%;
      max-width: 520px;
      background: var(--surface-strong);
      border-radius: var(--r-xl) var(--r-xl) 0 0;
      padding: 20px 22px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(40px);
      transition: transform 220ms ease;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-header {
      display: flex; align-items: center; gap: 10px;
    }
    .modal-title { font-size: 1.1rem; font-weight: 800; flex: 1; }
    .modal input[type="text"],
    .modal textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--surface-muted);
      color: var(--text);
      padding: 11px 13px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
      font-family: inherit;
    }
    .modal textarea { min-height: 130px; resize: vertical; line-height: 1.55; }
    .modal input[type="text"]:focus,
    .modal textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    .modal label { font-size: 0.83rem; font-weight: 700; color: var(--text-muted); display:block; margin-bottom:5px; }
    .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { padding: 10px 18px; border-radius: 999px; border: none; font-size: 0.92rem; font-weight: 800; cursor: pointer; transition: transform 160ms, box-shadow 160ms, opacity 160ms; }
    .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(52,40,86,0.16); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg,var(--accent),var(--accent-strong)); color:#fff; flex:1; }
    .btn-secondary { background: rgba(255,255,255,0.8); border: 1px solid var(--border); color: var(--text-muted); }
    .btn-danger { background: rgba(186,26,26,0.1); color: var(--danger); }
    .btn-tonal { background: var(--accent-soft); color: var(--accent); }

    /* saved list items in modal */
    .saved-list-items { display:grid; gap:6px; }
    .saved-item {
      display:flex; align-items:center; gap:8px;
      padding:9px 12px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.8);
      cursor:pointer;
      transition: background 140ms;
    }
    .saved-item:hover { background: var(--accent-soft); }
    .saved-item.selected { background: var(--accent-soft); border-color: var(--accent); }
    .saved-item-name { flex:1; font-weight:700; font-size:0.9rem; }
    .saved-item-count { font-size:0.78rem; color: var(--text-muted); }
    .saved-item-del {
      width:26px;height:26px;border-radius:50%;
      border:none; background: rgba(186,26,26,0.08);
      color: var(--danger); font-size:0.85rem;
      cursor:pointer; display:flex;align-items:center;justify-content:center;
      transition: background 140ms;
    }
    .saved-item-del:hover { background: rgba(186,26,26,0.18); }
    .modal-section { display:grid; gap:8px; }
    .modal-divider { height:1px; background: var(--border); }

    /* save-inline modal */
    .save-inline { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
    .save-inline .field { flex:1; min-width:160px; }

    /* ── DRAW ANIMATION POPUP MODAL ───────────────────────── */
    .draw-popup-overlay {
      position: fixed; inset: 0;
      background: rgba(18, 12, 32, 0.72);
      backdrop-filter: blur(12px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0; pointer-events: none;
      transition: opacity 280ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .draw-popup-overlay.open { opacity: 1; pointer-events: all; }
    .draw-popup-dialog {
      width: 100%;
      max-width: 580px;
      background: var(--surface-strong);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: var(--r-xl);
      box-shadow: 0 24px 60px rgba(18, 12, 32, 0.35);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.92) translateY(20px);
      transition: transform 280ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .draw-popup-overlay.open .draw-popup-dialog { transform: scale(1) translateY(0); }

    .draw-popup-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .draw-popup-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .draw-popup-stage {
      width: 100%;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px 0;
    }

    /* Wheel canvas container */
    .wheel-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid var(--danger);
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
      z-index: 10;
    }
    canvas#wheelCanvas {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    }

    /* Animated shuffle / slots / cards stage */
    .animation-stage-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .pop-reel {
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent);
      padding: 18px 24px;
      border-radius: var(--r-lg);
      background: var(--surface-muted);
      border: 2px dashed var(--accent);
      min-width: 240px;
      text-align: center;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.06);
    }

    /* Popup final results grid */
    .popup-results-grid {
      width: 100%;
      display: grid;
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .popup-result-card {
      padding: 12px 16px;
      border-radius: var(--r-lg);
      background: rgba(255,255,255,0.95);
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
      animation: reveal-up 320ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .popup-result-card h5 {
      color: var(--accent);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
      font-weight: 800;
    }
    .popup-result-card p {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text);
    }

    .draw-popup-actions {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .hidden { display:none !important; }

    /* ── ANIMATIONS ──────────────────────────────────────── */
    @keyframes float-chip   { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-8px) scale(1.03)} }
    @keyframes sway-chip    { 0%,100%{transform:translateX(0)} 50%{transform:translateX(6px)} }
    @keyframes bounce-chip  { 0%,100%{transform:translateY(0)} 45%{transform:translateY(-8px)} 70%{transform:translateY(1px)} }
    @keyframes ticker-chip  { 0%,100%{transform:translateY(0);opacity:1} 50%{transform:translateY(-6px);opacity:.8} }
    @keyframes slot-roll    { 0%{transform:translateY(0) scale(.97);opacity:.7} 100%{transform:translateY(-3px) scale(1.02);opacity:1} }
    @keyframes reveal-up    { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    /* ── RESPONSIVE ──────────────────────────────────────── */
    @media (max-width: 720px) {
      html, body { overflow: auto; }
      .app-body { grid-template-columns: 1fr; }
      .stage-panel { border-left: none; border-top: 1px solid var(--border); max-height: 380px; }
    }
  </style>
</head>
<body data-mode="single">

  <!-- ══ HEADER ══════════════════════════════════════════════ -->
  <header class="app-header">
    <span class="app-title">🎲 Tirage au Sort</span>
    <button id="install-button" class="icon-btn btn-accent hidden" type="button" onclick="installApp()" title="Installer l'app">⬇</button>
    <button class="icon-btn" type="button" onclick="openListsModal()" title="Gérer les listes">📋</button>
  </header>

  <!-- ══ MAIN ════════════════════════════════════════════════ -->
  <div class="app-body">

    <!-- LEFT : controls -->
    <div class="left-panel">

      <!-- mode tabs -->
      <div class="mode-tabs" role="tablist">
        <button class="mode-tab active" data-mode="single"  onclick="setMode('single')" >Gagnant(s)</button>
        <button class="mode-tab"        data-mode="pairs"   onclick="setMode('pairs')"  >Binômes</button>
        <button class="mode-tab"        data-mode="teams"   onclick="setMode('teams')"  >Équipes</button>
        <button class="mode-tab"        data-mode="order"   onclick="setMode('order')"  >Ordre</button>
        <button class="mode-tab"        data-mode="match"   onclick="setMode('match')"  >Association A→B</button>
      </div>

      <!-- Lists container with identical styling for List A and List B -->
      <div class="lists-wrapper">

        <!-- List B Card (match mode only) -->
        <div class="list-card hidden" id="secondary-area">

            </div>
          </div>

          <div id="saved-picker-b" class="hidden">
            <select id="saved-list-select-b" onchange="onSavedListPickB()" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-strong);color:var(--text);font-size:0.9rem;outline:none;font-family:inherit;">
              <option value="">Choisir une liste enregistrée…</option>

          <div id="adhoc-area-b" class="textarea-wrap">

      <!-- options: count / team-count -->
      <div class="options-row">

        <div id="teams-opts" class="opts-group hidden">

      <!-- save banner (appears after draw with ad-hoc list) -->
      <div id="save-banner" class="save-banner hidden">
        <span>Sauvegarder cette liste pour la réutiliser ?</span>
        <button onclick="openSaveCurrentModal()">Sauvegarder</button>
      </div>

      <!-- draw -->
      <button id="draw-button" class="draw-btn" type="button" onclick="startDraw()">Lancer le tirage</button>
    </div>

    <!-- RIGHT : stage -->
    <aside id="stage" class="stage-panel stage" data-mode="single" data-state="idle">
      <div class="stage-topline">

  </div>

  <!-- ══ MODAL : gérer les listes ════════════════════════════ -->
  <div id="lists-modal" class="modal-overlay" onclick="closeListsModalOnBg(event)">

        <div class="modal-actions">
          <button class="btn btn-tonal" onclick="updateSelectedList()">Enregistrer les modifications</button>
        </div>

  <!-- ══ POPUP MODAL : Tirage au sort en direct ══════════════ -->
  <div id="draw-popup-modal" class="draw-popup-overlay" role="dialog" aria-modal="true" aria-label="Tirage au sort en cours">
    <div class="draw-popup-dialog">
      <div class="draw-popup-header">
        <span class="draw-popup-title" id="pop-title">🎰 Tirage au Sort</span>
        <button class="icon-btn" onclick="closeDrawPopup()" title="Fermer">✕</button>
      </div>

      <div class="draw-popup-stage" id="pop-stage">
        <!-- Wheel View (Single Winner = 1) -->
        <div id="pop-wheel-container" class="wheel-wrapper hidden">
          <div class="wheel-pointer"></div>
          <canvas id="wheelCanvas" width="560" height="560"></canvas>
        </div>

        <!-- Reel / Cards / Shuffle View -->
        <div id="pop-anim-container" class="animation-stage-box">
          <div id="pop-reel" class="pop-reel">🎰 Melange en cours...</div>
        </div>

        <!-- Final Results Grid -->
        <div id="pop-results-container" class="popup-results-grid hidden"></div>
      </div>

      <div class="draw-popup-actions">
        <button class="btn btn-primary hidden" id="pop-relaunch-btn" onclick="startDraw()">Recommencer 🎲</button>
        <button class="btn btn-secondary" id="pop-close-btn" onclick="closeDrawPopup()">Fermer</button>
      </div>
    </div>
  </div>

  <!-- ══ MODAL : sauvegarder liste à la volée ═════════════════ -->
  <div id="save-modal" class="modal-overlay" onclick="closeSaveModalOnBg(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Sauvegarder la liste">
      <div class="modal-header">
        <span class="modal-title">💾 Sauvegarder la liste</span>
        <button class="icon-btn" onclick="closeSaveModal()">✕</button>
      </div>
      <div class="modal-section">
        <label for="quick-save-name">Nom de la liste</label>
        <input type="text" id="quick-save-name" placeholder="Nom de la liste">
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="quickSave()">Sauvegarder</button>
        <button class="btn btn-secondary" onclick="closeSaveModal()">Annuler</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'random-saved-lists-v1';
    const MODE_META = {
      single: { badge: 'Tirage simple',    state: 'En attente' },
      pairs:  { badge: 'Binômes',          state: 'En attente' },
      teams:  { badge: 'Équipes',          state: 'En attente' },
      order:  { badge: 'Ordre aléatoire',  state: 'En attente' },
      match:  { badge: 'Association A→B',  state: 'En attente' },
    };

    let drawInterval = null;
    let wheelAnimFrame = null;
    let deferredInstallPrompt = null;
    let currentSource = 'adhoc';       // 'adhoc' | 'saved'  (liste A)
    let currentSourceB = 'adhoc';      // 'adhoc' | 'saved'  (liste B)
    let selectedModalList = null;      // name of selected list in modal

    const WHEEL_COLORS = [
      '#6750a4', '#7f67be', '#006782', '#2886a3', '#2f6f4f',
      '#4a8b67', '#7a5600', '#9a7110', '#8f4c38', '#b2684f',
      '#3b52a4', '#d946ef', '#059669', '#d97706', '#dc2626'
    ];

    function openDrawPopup(titleText) {
      document.getElementById('pop-title').textContent = titleText || '🎰 Tirage au Sort';
      document.getElementById('pop-relaunch-btn').classList.add('hidden');
      document.getElementById('pop-results-container').classList.add('hidden');
      document.getElementById('pop-results-container').innerHTML = '';
      document.getElementById('draw-popup-modal').classList.add('open');
    }

    function closeDrawPopup() {
      if (drawInterval) { clearInterval(drawInterval); drawInterval = null; }
      if (wheelAnimFrame) { cancelAnimationFrame(wheelAnimFrame); wheelAnimFrame = null; }
      document.getElementById('draw-popup-modal').classList.remove('open');
      const btn = document.getElementById('draw-button');
      if (btn) btn.disabled = false;
    }

    function drawWheel(canvas, items, angle) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const cx = width / 2;
      const cy = height / 2;
      const radius = width / 2 - 10;
      const n = items.length;
      const sliceAngle = (2 * Math.PI) / n;

      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < n; i++) {
        const start = angle + i * sliceAngle;
        const end = start + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        /* Slice label */
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(start + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px Inter, sans-serif';
        const label = items[i].length > 14 ? items[i].substring(0, 12) + '…' : items[i];
        ctx.fillText(label, radius - 24, 6);
        ctx.restore();
      }

      /* Center peg */
      ctx.beginPath();
      ctx.arc(cx, cy, 32, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(103,80,164,0.3)';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, 14, 0, 2 * Math.PI);
      ctx.fillStyle = 'var(--accent, #6750a4)';
      ctx.fill();
    }

    function runWheelAnimation(items, winnerIndex, onComplete) {
      const canvas = document.getElementById('wheelCanvas');
      const n = items.length;
      const sliceAngle = (2 * Math.PI) / n;

      /* Target angle so winner slice aligns under top pointer (270deg / -90deg / 1.5 * PI) */
      const targetSliceCenter = winnerIndex * sliceAngle + sliceAngle / 2;
      const topPointerAngle = (3 * Math.PI) / 2;
      const finalBaseAngle = topPointerAngle - targetSliceCenter;

      const extraRounds = 5 + Math.floor(Math.random() * 2); // 5-6 full spins
      const totalRotation = extraRounds * 2 * Math.PI + (finalBaseAngle % (2 * Math.PI));

      let startAngle = 0;
      let startTime = null;
      const duration = 2200; // ms

      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);

        /* Cubic ease out for wheel slowdown */
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const currentAngle = startAngle + totalRotation * easeOut;

        drawWheel(canvas, items, currentAngle);

        if (progress < 1) {
          wheelAnimFrame = requestAnimationFrame(animate);
        } else {
          wheelAnimFrame = null;
          if (onComplete) onComplete();
        }
      }

      if (wheelAnimFrame) cancelAnimationFrame(wheelAnimFrame);
      wheelAnimFrame = requestAnimationFrame(animate);
    }

    /* ── storage ── */
    function loadSavedLists() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed)
          ? parsed.filter(e => e && typeof e.name === 'string' && Array.isArray(e.items))
          : [];
      } catch { return []; }
    }
    function persistSavedLists(lists) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(lists));
    }

    /* ── utils ── */
    function getCleanList(id) {
      return document.getElementById(id).value
        .split('\n').map(s => s.trim()).filter(Boolean);
    }
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function escapeHTML(v) {
      return v.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
               .replaceAll('"','&quot;').replaceAll("'",'&#39;');
    }

    /* ── mode ── */
    function setMode(mode) {
      document.body.dataset.mode = mode;
      document.getElementById('stage').dataset.mode = mode;
      document.querySelectorAll('.mode-tab').forEach(t =>
        t.classList.toggle('active', t.dataset.mode === mode));
      document.getElementById('stage-badge').textContent = MODE_META[mode].badge;
      document.getElementById('single-opts').classList.toggle('hidden', mode !== 'single');
      document.getElementById('teams-opts').classList.toggle('hidden', mode !== 'teams');
      const isMatch = mode === 'match';
      document.getElementById('list1-label').textContent =
        isMatch ? 'Éléments Liste A (un par ligne)' : 'Éléments (un par ligne)';
      document.getElementById('src-a-label').textContent = isMatch ? 'Liste A :' : 'Source :';
      document.getElementById('secondary-area').classList.toggle('hidden', !isMatch);
      if (document.getElementById('stage').dataset.state !== 'spinning') {
        renderStageDecor(mode, getListForDraw(), getListBForDraw());
      }
    }

    /* ── source selection ── */
    function selectSource(src) {
      currentSource = src;
      document.getElementById('src-adhoc').classList.toggle('active', src === 'adhoc');
      document.getElementById('src-saved').classList.toggle('active', src === 'saved');
      document.getElementById('saved-picker').classList.toggle('hidden', src !== 'saved');
      document.getElementById('adhoc-area').classList.toggle('hidden', src !== 'adhoc');
      if (src === 'saved') {
        renderSavedSelectInHeader();
      }
    }

    function selectSourceB(src) {
      currentSourceB = src;
      document.getElementById('src-b-adhoc').classList.toggle('active', src === 'adhoc');
      document.getElementById('src-b-saved').classList.toggle('active', src === 'saved');
      document.getElementById('saved-picker-b').classList.toggle('hidden', src !== 'saved');
      document.getElementById('adhoc-area-b').classList.toggle('hidden', src !== 'adhoc');
      if (src === 'saved') {
        renderSavedSelectB();
      }
    }

    function renderSavedSelectInHeader() {
      const sel = document.getElementById('saved-list-select');
      const lists = loadSavedLists().sort((x,y) => x.name.localeCompare(y.name,'fr'));
      sel.innerHTML = '<option value="">Choisir une liste enregistrée…</option>';
      lists.forEach(l => {
        const o = document.createElement('option');
        o.value = l.name;
        o.textContent = `${l.name} (${l.items.length})`;
        sel.appendChild(o);
      });
    }

    function renderSavedSelectB() {
      const sel = document.getElementById('saved-list-select-b');
      const lists = loadSavedLists().sort((x,y) => x.name.localeCompare(y.name,'fr'));
      sel.innerHTML = '<option value="">Choisir une liste enregistrée…</option>';
      lists.forEach(l => {
        const o = document.createElement('option');
        o.value = l.name;
        o.textContent = `${l.name} (${l.items.length})`;
        sel.appendChild(o);
      });
    }

    function renderAllSavedSelects() {
      renderSavedSelectInHeader();
      renderSavedSelectB();
    }

    function onSavedListPick() {
      const mode = document.body.dataset.mode || 'single';
      renderStageDecor(mode, getListForDraw(), getListBForDraw());
    }

    function onSavedListPickB() {
      const mode = document.body.dataset.mode || 'single';
      renderStageDecor(mode, getListForDraw(), getListBForDraw());
    }

    function getListForDraw() {
      if (currentSource === 'saved') {
        const name = document.getElementById('saved-list-select').value;
        const found = loadSavedLists().find(l => l.name === name);
        return found ? found.items : [];
      }
      return getCleanList('list1');
    }

    function getListBForDraw() {
      if (currentSourceB === 'saved') {
        const name = document.getElementById('saved-list-select-b').value;
        const found = loadSavedLists().find(l => l.name === name);
        return found ? found.items : [];
      }
      return getCleanList('list2');
    }

    /* ── stage decor ── */
    function renderStageDecor(mode, listA, listB) {
      const orbit = document.getElementById('stageOrbit');
      const sample = shuffle(listA).slice(0, mode === 'order' ? 4 : 6);

      if (mode === 'match') {
        const sampleB = shuffle(listB).slice(0, 3);
        orbit.innerHTML = (sample.slice(0,3).map((item, i) => `
          <div class="match-row" style="--delay:${i*80}ms">
            <span class="stage-chip">${escapeHTML(item)}</span>
            <span class="match-arrow">↔</span>
            <span class="stage-chip">${escapeHTML(sampleB[i] || '?')}</span>
          </div>`).join('')) || `<div class="match-row"><span class="stage-chip">A</span><span class="match-arrow">↔</span><span class="stage-chip">B</span></div>`;
        return;
      }
      orbit.innerHTML = sample.length
        ? sample.map((item,i) => `<span class="stage-chip" style="--delay:${i*90}ms">${escapeHTML(item)}</span>`).join('')
        : `<span class="stage-chip">Ajoute des éléments</span><span class="stage-chip">puis lance le tirage</span>`;
    }

    /* ── draw ── */
    function startDraw() {
      const mode = document.body.dataset.mode || 'single';
      const list1 = getListForDraw();
      const list2 = getListBForDraw();

      if (list1.length === 0) { alert('Ajoute au moins un élément.'); return; }
      if (mode === 'match' && list2.length === 0) { alert('Ajoute des éléments dans la liste B.'); return; }

      const count = Math.max(1, parseInt(document.getElementById('count').value, 10) || 1);
      const isSingleWheel = (mode === 'single' && count === 1);

      /* Prepare stage & button */
      const stage = document.getElementById('stage');
      const slot = document.getElementById('slot');
      const btn = document.getElementById('draw-button');
      const results = document.getElementById('results');
      results.innerHTML = '';
      stage.dataset.state = 'spinning';
      document.getElementById('stage-state').textContent = 'En cours…';
      btn.disabled = true;

      /* Open Popup Dialog */
      openDrawPopup(MODE_META[mode] ? MODE_META[mode].badge : 'Tirage');

      const wheelContainer = document.getElementById('pop-wheel-container');
      const animContainer = document.getElementById('pop-anim-container');
      const reelEl = document.getElementById('pop-reel');
      const popResultsGrid = document.getElementById('pop-results-container');

      if (isSingleWheel) {
        wheelContainer.classList.remove('hidden');
        animContainer.classList.add('hidden');

        const shuffled = shuffle(list1);
        const winner = shuffled[0];
        const winnerIndex = list1.indexOf(winner);

        runWheelAnimation(list1, winnerIndex, () => {
          finishDrawResults(list1, list2, mode, [{ title: 'Gagnant', value: `🎉 ${winner}` }]);
        });
      } else {
        wheelContainer.classList.add('hidden');
        animContainer.classList.remove('hidden');

        let counter = 0;
        const modeLabels = {
          single: '🎲 Tirage des gagnants...',
          pairs: '👥 Formation des binômes...',
          teams: '🏆 Constitution des équipes...',
          order: '📋 Mélange de l\'ordre...',
          match: '🔗 Association des listes A ↔ B...'
        };

        if (drawInterval) clearInterval(drawInterval);
        drawInterval = setInterval(() => {
          const randItem1 = list1[Math.floor(Math.random() * list1.length)];
          if (mode === 'match' && list2.length) {
            const randItem2 = list2[Math.floor(Math.random() * list2.length)];
            reelEl.innerHTML = `🔀 <strong>${escapeHTML(randItem1)}</strong> ↔ <strong>${escapeHTML(randItem2)}</strong>`;
          } else {
            reelEl.innerHTML = `🎲 <strong>${escapeHTML(randItem1)}</strong>`;
          }

          if (++counter >= 22) {
            clearInterval(drawInterval); drawInterval = null;

            /* Build final results array */
            const computedResults = computeDrawResults(list1, list2, mode);
            finishDrawResults(list1, list2, mode, computedResults);
          }
        }, 80);
      }
    }

    function computeDrawResults(list, list2, mode) {
      const shuffled = shuffle(list);
      const res = [];

      if (mode === 'single') {
        const count = Math.max(1, parseInt(document.getElementById('count').value, 10) || 1);
        const winners = shuffled.slice(0, Math.min(count, shuffled.length));
        winners.forEach((w, i) => res.push({ title: `Gagnant #${i + 1}`, value: w }));
      } else if (mode === 'order') {
        shuffled.forEach((item, i) => res.push({ title: `Rang #${i + 1}`, value: item }));
      } else if (mode === 'pairs') {
        for (let i = 0; i < shuffled.length; i += 2) {
          const pair = shuffled.slice(i, i + 2);
          res.push({
            title: pair.length === 2 ? `Binôme #${i / 2 + 1}` : 'Seul',
            value: pair.join(' & ')
          });
        }
      } else if (mode === 'teams') {
        const tc = Math.min(100, Math.max(2, parseInt(document.getElementById('team-count').value, 10) || 2));
        const teams = Array.from({ length: tc }, () => []);
        shuffled.forEach((item, i) => teams[i % tc].push(item));
        teams.forEach((t, i) => res.push({ title: `Équipe ${i + 1}`, value: t.join(', ') || '—' }));
      } else if (mode === 'match') {
        const shuffled2 = shuffle(list2);
        shuffled.forEach((item, i) => res.push({ title: item, value: `➡️ ${shuffled2[i] || '—'}` }));
      }
      return res;
    }

    function finishDrawResults(list1, list2, mode, computedResults) {
      const stage = document.getElementById('stage');
      const slot = document.getElementById('slot');
      const btn = document.getElementById('draw-button');
      const results = document.getElementById('results');
      const popResultsGrid = document.getElementById('pop-results-container');

      if (window.confetti) window.confetti({ particleCount: 90, spread: 80, origin: { y: 0.5 } });

      stage.dataset.state = 'revealed';
      document.getElementById('stage-state').textContent = 'Résultat';
      renderStageDecor(mode, list1, list2);

      slot.textContent = computedResults[0] ? computedResults[0].value : 'Résultat';

      /* Populate right panel stage results */
      results.innerHTML = '';
      computedResults.forEach((item, idx) => {
        appendResultCard(item.title, item.value, idx);
      });

      /* Populate popup modal results grid */
      popResultsGrid.innerHTML = '';
      popResultsGrid.classList.remove('hidden');
      computedResults.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'popup-result-card';
        card.style.animationDelay = `${idx * 60}ms`;
        card.innerHTML = `<h5>${escapeHTML(item.title)}</h5><p>${escapeHTML(item.value)}</p>`;
        popResultsGrid.appendChild(card);
      });

      document.getElementById('pop-relaunch-btn').classList.remove('hidden');
      btn.disabled = false;

      if (currentSource === 'adhoc') {
        document.getElementById('save-banner').classList.remove('hidden');
      }
    }

    function processResults(list, list2, mode) {
      /* Handled directly in finishDrawResults */
    }

    function appendResultCard(title, value, index) {
      const results = document.getElementById('results');
      const card = document.createElement('div');
      card.className = 'result-box';
      card.style.setProperty('--delay', `${index*65}ms`);
      card.innerHTML = `<h4>${escapeHTML(title)}</h4><p>${escapeHTML(value)}</p>`;
      results.appendChild(card);
    }

    /* ── lists modal ── */
    function openListsModal() {
      renderModalSavedList();
      document.getElementById('lists-modal').classList.add('open');
    }
    function closeListsModal() {
      document.getElementById('lists-modal').classList.remove('open');
      selectedModalList = null;
      document.getElementById('edit-section').classList.add('hidden');
    }
    function closeListsModalOnBg(e) {
      if (e.target === document.getElementById('lists-modal')) closeListsModal();
    }

    function renderModalSavedList() {
      const container = document.getElementById('modal-saved-list');
      const lists = loadSavedLists().sort((a,b) => a.name.localeCompare(b.name,'fr'));
      container.innerHTML = '';
      if (lists.length === 0) {
        const p = document.createElement('p');
        p.style.cssText = 'color:var(--text-muted);font-size:0.88rem;';
        p.textContent = 'Aucune liste enregistrée.';
        container.appendChild(p);
        return;
      }
      lists.forEach(l => {
        const row = document.createElement('div');
        row.className = 'saved-item' + (selectedModalList === l.name ? ' selected' : '');
        row.addEventListener('click', () => selectModalList(l.name));

        const nameSpan = document.createElement('span');
        nameSpan.className = 'saved-item-name';
        nameSpan.textContent = l.name;

        const countSpan = document.createElement('span');
        countSpan.className = 'saved-item-count';
        countSpan.textContent = `${l.items.length} éléments`;

        const delBtn = document.createElement('button');
        delBtn.className = 'saved-item-del';
        delBtn.title = 'Supprimer';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', e => { e.stopPropagation(); deleteList(l.name); });

        row.appendChild(nameSpan);
        row.appendChild(countSpan);
        row.appendChild(delBtn);
        container.appendChild(row);
      });
    }

    function selectModalList(name) {
      selectedModalList = name;
      const lists = loadSavedLists();
      const found = lists.find(l => l.name === name);
      if (!found) return;
      document.getElementById('edit-list-items').value = found.items.join('\n');
      document.getElementById('edit-section').classList.remove('hidden');
      renderModalSavedList();
    }

    function createNewList() {
      const name = document.getElementById('new-list-name').value.trim();
      const items = document.getElementById('new-list-items').value.split('\n').map(s=>s.trim()).filter(Boolean);
      if (!name) { alert('Donne un nom à la liste.'); return; }
      if (items.length === 0) { alert('Ajoute au moins un élément.'); return; }
      const lists = loadSavedLists();
      if (lists.some(l => l.name === name)) { alert('Une liste avec ce nom existe déjà.'); return; }
      lists.push({ name, items, updatedAt: new Date().toISOString() });
      persistSavedLists(lists);
      document.getElementById('new-list-name').value = '';
      document.getElementById('new-list-items').value = '';
      renderModalSavedList();
      renderAllSavedSelects();
    }

    function updateSelectedList() {
      if (!selectedModalList) return;
      const items = document.getElementById('edit-list-items').value.split('\n').map(s=>s.trim()).filter(Boolean);
      if (items.length === 0) { alert('La liste ne peut pas être vide.'); return; }
      const lists = loadSavedLists();
      const idx = lists.findIndex(l => l.name === selectedModalList);
      if (idx === -1) return;
      lists[idx].items = items;
      lists[idx].updatedAt = new Date().toISOString();
      persistSavedLists(lists);
      renderModalSavedList();
      renderAllSavedSelects();
    }

    function deleteList(name) {
      if (!confirm(`Supprimer la liste "${name}" ?`)) return;
      const lists = loadSavedLists().filter(l => l.name !== name);
      persistSavedLists(lists);
      if (selectedModalList === name) {
        selectedModalList = null;
        document.getElementById('edit-section').classList.add('hidden');
      }
      renderModalSavedList();
      renderAllSavedSelects();
    }

    /* ── quick save (from save banner) ── */
    function openSaveCurrentModal() {
      document.getElementById('save-modal').classList.add('open');
    }
    function closeSaveModal() {
      document.getElementById('save-modal').classList.remove('open');
    }
    function closeSaveModalOnBg(e) {
      if (e.target === document.getElementById('save-modal')) closeSaveModal();
    }
    function quickSave() {
      const name = document.getElementById('quick-save-name').value.trim();
      const items = getCleanList('list1');
      if (!name) { alert('Donne un nom à la liste.'); return; }
      if (items.length === 0) { alert('La liste est vide.'); return; }
      const lists = loadSavedLists();
      if (lists.some(l => l.name === name)) { alert('Une liste avec ce nom existe déjà.'); return; }
      lists.push({ name, items, updatedAt: new Date().toISOString() });
      persistSavedLists(lists);
      renderAllSavedSelects();
      document.getElementById('quick-save-name').value = '';
      closeSaveModal();
      document.getElementById('save-banner').classList.add('hidden');
    }

    /* ── install ── */
    async function installApp() {
      if (!deferredInstallPrompt) {
        alert('Utilise le menu du navigateur pour installer l\'app.');
        return;
      }
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      document.getElementById('install-button').classList.add('hidden');
    }

    function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) return;
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
    }

    /* ── init ── */
    function initApp() {
      setMode('single');
      renderAllSavedSelects();
      renderStageDecor('single', [], []);
      registerServiceWorker();

      document.getElementById('list1').addEventListener('input', () => {
        const mode = document.body.dataset.mode || 'single';
        if (document.getElementById('stage').dataset.state !== 'spinning') {
          renderStageDecor(mode, getCleanList('list1'), getListBForDraw());
        }
        document.getElementById('save-banner').classList.add('hidden');
      });

      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        deferredInstallPrompt = e;
        document.getElementById('install-button').classList.remove('hidden');
      });
      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        document.getElementById('install-button').classList.add('hidden');
      });
    }

    initApp();
  </script>
</body>
</html>
